name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk GroceryAccountant.apk

      - name: Run calculator and import tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Grocery Accountant 1.0.${{ github.run_number }}
          make_latest: true
          files: GroceryAccountant.apk
          body: |
            Tap **GroceryAccountant.apk** below on your Android phone to download, then open it to install.
            The first time, Android will ask you to allow installs from your browser — tap Settings → Allow.
            Built from ${{ github.sha }}.
